# RGBY · новости из Telegram-канала @rgby_feed → content/news/telegram.js и обложки assets/images/news/tg/.
# Живёт в репозитории стенда (.github/workflows/tg-news.yml), попадает туда с релизом (site/.github/) через publish-stand.
# Источник — tools/telegram/ в репозитории RGBY. Запуск вручную: GitHub → Actions → «Новости из Telegram» → Run workflow.
name: Новости из Telegram
on:
  schedule:
    - cron: "7,37 * * * *"   # каждые 30 минут (GitHub может задерживать запуск на несколько минут)
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency:
  group: tg-news
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Прочитать канал
        run: node .github/tg-news/tg-news.mjs --site . --channel rgby_feed
      - name: Отправить изменения
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "rgby-telegram-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/news/telegram.js assets/images/news/tg
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          git commit -q -m "Новости из Telegram: обновление ленты"
          # CMS и publish-stand могут коммитить в это же время — подтягиваем и повторяем
          for i in 1 2 3 4 5; do
            if git pull --rebase -q && git push -q; then echo "Отправлено"; break; fi
            sleep $((i * 5))
          done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || true
