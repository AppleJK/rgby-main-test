<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — RGBY</title>
<meta name="theme-color" content="#2C4FFF">
<script>
  // 404 отдаётся на любом адресе, поэтому корень сайта вычисляется из адреса:
  // на стенде GitHub Pages сайт лежит в подпапке /rgby-main-test/, на сервере — в корне.
  window.RGBY_ROOT = /^\/rgby-main-test(\/|$)/.test(location.pathname) ? "/rgby-main-test/" : "/";
  document.write('<link rel="icon" href="' + RGBY_ROOT + 'favicon.svg" type="image/svg+xml">');
  document.write('<style>@font-face{font-family:"TT Interphases Pro";src:url(' + RGBY_ROOT + 'core/2026-10-14/fonts/TTInterphasesPro-Bold.otf) format("opentype");font-weight:700;font-display:swap}@font-face{font-family:"TT Interphases Pro";src:url(' + RGBY_ROOT + 'core/2026-10-14/fonts/TTInterphasesPro-Medium.otf) format("opentype");font-weight:500;font-display:swap}</style>');
</script>
<style>
  :root { --blue: #2C4FFF; --ink: #061025; --paper: #F3F4FF; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--blue); color: var(--paper);
    font-family: "TT Interphases Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 500; display: flex; flex-direction: column; justify-content: space-between;
    padding: 20px; min-height: 100vh;
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-weight: 700; font-size: 28px; letter-spacing: -0.04em; color: var(--paper); text-decoration: none; }
  .code { font-weight: 700; font-size: clamp(120px, 28vw, 400px); line-height: 0.8; letter-spacing: -0.05em; }
  h1 { font-weight: 700; font-size: clamp(28px, 4vw, 56px); line-height: 0.94; letter-spacing: -0.03em; margin-top: 24px; max-width: 14ch; }
  p { font-size: 17px; line-height: 1.29; opacity: 0.6; margin-top: 16px; max-width: 34ch; }
  .go {
    display: inline-flex; align-items: center; gap: 12px; margin-top: 32px;
    background: var(--paper); color: var(--ink); padding: 18px 24px;
    font-weight: 700; font-size: 18px; letter-spacing: -0.02em; text-decoration: none;
    transition: background .18s, color .18s;
  }
  .go:hover { background: var(--ink); color: var(--paper); }
  .go:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="top"><a class="logo" href="/" data-root>RGBY</a></div>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, адрес набран с ошибкой или страница переехала.</p>
    <a class="go" href="/" data-root>На главную →</a>
  </main>
  <div></div>
  <script>
    document.querySelectorAll("[data-root]").forEach(function (a) { a.setAttribute("href", window.RGBY_ROOT); });
  </script>
</body>
</html>
