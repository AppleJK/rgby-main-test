// Typographic policy: glue 1–3-letter words (предлоги, союзы, частицы) to the next word and «—» to the previous one with NBSP.
(function () {
  const SHORT = /(^|[\s(«„"\u00A0])([А-Яа-яЁёA-Za-z]{1,3}|[0-9]{1,3})[ \t]+(?=\S)/g;
  const DASH = /[ \t]+([—–])/g;
  const SKIP = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, INPUT: 1, CODE: 1, PRE: 1, OPTION: 1 };
  const fix = s => { let o = s, n; do { n = o; o = o.replace(SHORT, "$1$2\u00A0"); } while (o !== n); return o.replace(DASH, "\u00A0$1"); };
  const walk = root => {
    if (root.nodeType === 3) { const p = root.parentNode; if (p && !SKIP[p.nodeName]) { const v = root.nodeValue, f = fix(v); if (f !== v) root.nodeValue = f; } return; }
    if (root.nodeType !== 1 || SKIP[root.nodeName]) return;
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentNode && !SKIP[n.parentNode.nodeName] && /\s/.test(n.nodeValue) ? 1 : 3) });

  };
  let q = new Set(), raf = 0;
  const flush = () => { raf = 0; q.forEach(walk); q.clear(); };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
